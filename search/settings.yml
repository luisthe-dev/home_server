use_default_settings: true

server:
  # Base secret key placeholder - overridden at runtime via SEARXNG_SECRET in docker-compose.yml
  secret_key: "ultrasecretkey"
  # Allows other containers to talk to it
  bind_address: "0.0.0.0"

search:
  # The 'json' format is required for your Laravel RAG pipeline to read results
  formats:
    - html
    - json

# Optional: Disable engines that are often slow or block local IPs
engines:
  - name: google
    engine: google
    disabled: false
  - name: bing
    engine: bing
    disabled: true
